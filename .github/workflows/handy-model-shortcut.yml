name: Handy model shortcut UI CI

on:
  push:
    branches:
      - ci/handy-model-shortcut-20261006

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out delivery artifacts
        uses: actions/checkout@v4
        with:
          path: delivery

      - name: Check out Handy
        uses: actions/checkout@v4
        with:
          repository: cjpais/Handy
          ref: a94b403e0610049fafa54b0a4077db2945084dd8
          path: handy

      - name: Apply UI model-shortcut patch
        working-directory: handy
        run: git apply ../delivery/handy-ui.patch

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev libevdev-dev libasound2-dev pkg-config libssl-dev libvulkan-dev vulkan-tools glslc spirv-headers glslang-tools libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libgtk-layer-shell0 libgtk-layer-shell-dev patchelf cmake

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Format Rust
        working-directory: handy
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Install frontend dependencies
        working-directory: handy
        run: bun install --frozen-lockfile

      - name: Format frontend patch
        working-directory: handy
        run: bunx prettier --write src src/i18n

      - name: Verify translation keys
        working-directory: handy
        run: bun run check:translations

      - name: Build frontend
        working-directory: handy
        run: bun run build

      - name: Lint frontend
        working-directory: handy
        run: bun run lint

      - name: Test secondary shortcut routing
        working-directory: handy
        run: cargo test --manifest-path src-tauri/Cargo.toml secondary_binding_uses_transcription_coordinator --lib -- --nocapture

      - name: Test default shortcut parser
        working-directory: handy
        run: cargo test --manifest-path src-tauri/Cargo.toml accepts_the_default_shortcuts --lib -- --nocapture

      - name: Verify final diff
        working-directory: handy
        run: git diff --check

      - name: Summarize changed files
        if: always()
        working-directory: handy
        run: git diff --stat
